[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Catégories transverses, sélectionnables avec -m (ex. `-m security`).
# Les tests non marqués sont des tests unitaires.
markers =
    security: tests de sécurité (SSRF, contrôle d'accès, secrets, injection)
    integration: tests de bout en bout sur une route Flask réelle (réseau simulé)

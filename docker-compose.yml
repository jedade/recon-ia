version: '3.9'

services:

  caddy:
    # SEUL service publié sur Internet (plan d'action phase 1, décision D5) :
    # reverse proxy TLS automatique devant `web` et `api` — voir
    # caddy/Caddyfile. Remplace les scripts nginx/certbot qui référençaient
    # des services absents de ce fichier.
    image: caddy:2.8.4-alpine
    container_name: caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-http://localhost}
      - API_ADDRESS=${API_ADDRESS:-http://api.localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: web
    # Plus de port publié : servi par Caddy (SITE_ADDRESS).
    expose:
      - "80"
    environment:
      # Consommé par web/templates/config.js.template via le mécanisme
      # envsubst intégré à l'image nginx officielle (docker-entrypoint.d) :
      # régénère web/config.js à CHAQUE démarrage du conteneur, avant nginx.
      # URL de l'API JOIGNABLE PAR LE NAVIGATEUR (jamais un nom de service
      # Docker) : http://api.localhost en local, https://api.idachallenge.bj
      # en prod. Utilisée par index.html, result.html et dashboard.html.
      - DASHBOARD_API_BASE=${DASHBOARD_API_BASE:-}
      # Clé PUBLIQUE du widget Cloudflare Turnstile (formulaire). Vide en
      # développement : le widget n'est pas affiché et l'API ne vérifie rien
      # tant que TURNSTILE_SECRET_KEY est vide aussi.
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
    volumes:
      - ./web:/usr/share/nginx/html
      - ./web/templates:/etc/nginx/templates:ro
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    # Publié sur la boucle locale UNIQUEMENT (diagnostic, setup.sh) : depuis
    # Internet, l'API n'est joignable qu'à travers Caddy (API_ADDRESS).
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./api/.env
    environment:
      - OLLAMA_URL=http://ollama:11434
      - ANALYSIS_MODEL=${ANALYSIS_MODEL:-qwen2.5:7b}
      - ANALYSIS_MAX_SEARCH_ROUNDS=${ANALYSIS_MAX_SEARCH_ROUNDS:-6}
      - ANALYSIS_LANG=${ANALYSIS_LANG:-fr}
      # Stockage partagé du rate limiter entre les workers gunicorn.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      # Secrets PARTAGÉS avec n8n : définis UNE seule fois, dans le .env
      # racine, et injectés ici et dans le service n8n — jamais dans
      # api/.env (deux copies finiraient par diverger). Voir CLAUDE.md §7.
      - PIPELINE_SERVICE_TOKEN=${PIPELINE_SERVICE_TOKEN:-}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      - N8N_PIPELINE_WEBHOOK_URL=${N8N_PIPELINE_WEBHOOK_URL:-http://n8n:5678/webhook/recon-ia-pipeline}
      # Coffre des résultats (api/utils/result_vault.py) : stable, ≥ 32
      # caractères. Le changer rend introuvables tous les codes déjà émis.
      - RESULTS_ACCESS_SECRET=${RESULTS_ACCESS_SECRET:-}
      - RESULTS_PAGE_URL=${RESULTS_PAGE_URL:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Exactement un proxy de confiance devant l'API : Caddy.
      - TRUSTED_PROXY_COUNT=1
      # Rôles PostgreSQL à droits minimaux (api/migrate.py::ensure_roles) :
      # l'API s'exécute en `recon_app` ; migrate.py garde le compte
      # propriétaire et fixe aussi le mot de passe de `rag_writer` (n8n).
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-}
      - RAG_DB_PASSWORD=${RAG_DB_PASSWORD:-}
    volumes:
      - ./api:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ./ollama:/root/.ollama
    # Port NON publié : Ollama n'a AUCUNE authentification. Exposé, il permet
    # à quiconque de consommer le CPU/GPU (/api/generate) et de faire
    # télécharger des modèles arbitraires (/api/pull → saturation disque).
    expose:
      - "11434"
    restart: unless-stopped
   

  n8n:
    # Image custom (n8n/Dockerfile) : ajoute bash+whois et un entrypoint qui
    # provisionne automatiquement credentials + workflows recon-ia avant de
    # démarrer n8n — voir n8n/provision-and-start.sh.
    build:
      context: ./n8n
      dockerfile: Dockerfile
      args:
        # docker.n8n.io/n8nio/n8n par défaut ; n8nio/n8n (Docker Hub) si le
        # registre officiel limite le débit (HTTP 429).
        N8N_IMAGE: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n}
    container_name: n8n
    # Pas d'`env_file: ./api/.env` ici : n8n n'a besoin que de DOMAIN_URL_API
    # (injecté dans `environment:` ci-dessous). Lui donner le .env complet
    # exposait SMTP_PASSWORD, les clés IA et ADMIN_PASSWORD_PLAIN.
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./n8n_ressource:/tmp/n8n-source-docs
      - ./n8n/workflows:/workflows:ro
      # ATTENTION — NE PAS remonter /var/run/docker.sock ici.
      # Le socket Docker donne un contrôle root complet sur l'HÔTE : un Code
      # node (ou toute compromission de l'UI n8n) peut créer un conteneur
      # privilégié montant `/` et s'échapper. Aucun workflow de ce projet n'en
      # a besoin. Si une action Docker devient nécessaire, passer par un proxy
      # socket filtré en lecture seule, jamais par le socket brut.
    environment:
      # Accès $env BLOQUÉ dans les nœuds (2026-10-19) : les workflows
      # appellent l'API à son adresse interne fixe (http://api:8080) et
      # n'ont plus besoin d'aucune variable. Les secrets ci-dessous ne
      # servent qu'au script de provisioning (generate-credentials.js), qui
      # les range dans le stockage CHIFFRÉ des credentials n8n — aucun Code
      # node ne peut plus les lire.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      # Clé de chiffrement des credentials n8n : FIXE (sinon générée au
      # premier démarrage dans n8n_data et perdue avec ce volume).
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      # Jeton de service (appels n8n → API) et secret du webhook (API → n8n).
      # Plus aucun mot de passe admin n'est confié à n8n.
      - PIPELINE_SERVICE_TOKEN=${PIPELINE_SERVICE_TOKEN:-}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      # Credential Postgres du nœud RAG PGVector Store : rôle `rag_writer`
      # limité à rag_documents (créé par api/migrate.py). n8n ne reçoit plus
      # le mot de passe du compte propriétaire de la base (2026-10-19).
      - POSTGRES_DB=${POSTGRES_DB}
      - RAG_DB_PASSWORD=${RAG_DB_PASSWORD:-}
      # "Local File Trigger" (workflow RAG) est désactivé par défaut depuis
      # n8n 2.0 pour raisons de sécurité — liste d'exclusion vide = réactivé.
      - NODES_EXCLUDE=[]
      # Sécurité récente de n8n : les nœuds fichiers (Read/Write Files from
      # Disk...) sont restreints par défaut à ~/.n8n-files (constaté :
      # "Access to the file is not allowed. Allowed paths: /home/node/.n8n-files"
      # sur le workflow RAG). Séparateur ';' (PAS ',') — voir
      # n8n-core/dist/execution-engine/.../file-system-helper-functions.js.
      # Sans cette variable, l'ingestion RAG automatique (voir
      # n8n/workflows/rag-ingestion.json) échoue systématiquement.
      - N8N_RESTRICT_FILE_ACCESS_TO=/tmp/n8n-source-docs
      # n8n n'est plus exposé (2026-10-19) : le webhook du pipeline n'est
      # appelé que par l'API sur le réseau interne, l'éditeur ne s'ouvre que
      # par tunnel SSH (`ssh -L 5678:127.0.0.1:5678 serveur`, puis
      # http://localhost:5678). Créer le compte propriétaire n8n dès le
      # premier démarrage : tant qu'il n'existe pas, le premier visiteur de
      # l'éditeur peut le créer.
      - N8N_SECURE_COOKIE=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=0.0.0.0
      - WEBHOOK_URL=http://n8n:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Europe/Paris
      - EXECUTIONS_TIMEOUT=600000
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=3
      - EXECUTIONS_DATA_PRUNE_INTERVAL=1440
      - N8N_PUSH_BACKEND=websocket
      - NODE_ENV=production
      # Port interne du réseau docker (11434) : depuis un autre conteneur,
      # seul le port interne est joignable.
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
    ports:
      # Boucle locale uniquement (tunnel SSH pour l'éditeur), jamais 0.0.0.0
      - "127.0.0.1:5678:5678"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    # Stockage partagé du rate limiter (Flask-Limiter).
    #
    # Indispensable depuis le passage à gunicorn multi-workers : avec le
    # stockage "memory://", chaque worker tient son propre compteur en RAM.
    # Une limite de 20 requêtes/heure autoriserait donc 20 × nb_workers
    # requêtes, et les compteurs seraient remis à zéro à chaque redémarrage.
    image: redis:alpine
    container_name: redis
    # Aucun port publié : le service n'est joignable que sur le réseau interne
    # compose. Redis n'a pas d'authentification activée par défaut — l'exposer
    # sur l'hôte le rendrait accessible sans mot de passe.
    expose:
      - "6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    # pgvector/pgvector:pg16 = postgres:16 + extension pgvector préinstallée.
    # Remplace le couple postgres:16-alpine + qdrant : le RAG n8n (cheat sheets
    # OWASP, CWE/CAPEC, ASVS/WSTG…) est stocké dans la table rag_documents
    # (voir api/migrate.py) plutôt que dans un service Qdrant séparé.
    image: pgvector/pgvector:pg16
    container_name: postgres
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    env_file:
      - ./api/.env  # ← Charge POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD depuis .env
    # Port NON publié sur l'hôte : la base contient PII, scan_results et PDF.
    # L'exposer sur 0.0.0.0 en fait une cible de brute-force directe depuis
    # Internet. Les autres conteneurs y accèdent par le réseau interne.
    # Pour un accès local ponctuel : "127.0.0.1:5432:5432".
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5